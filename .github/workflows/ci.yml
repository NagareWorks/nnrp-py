name: CI

on:
  push:
    branches:
      - develop
      - main
      - release/**
  pull_request:
  workflow_dispatch:

jobs:
  content-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject prohibited vendor/model references
        id: content_policy
        shell: bash
        run: |
          set +e
          first_term="Anthro""pic"
          second_term="Clau""de"
          output="$(
            set -euo pipefail
            violations=0
            for term in "$first_term" "$second_term"; do
              matches="$(git grep -n -I -i -F -- "$term" -- . || true)"
              if [ -n "$matches" ]; then
                echo "Tracked file content contains prohibited keyword: $term"
                echo "$matches"
                violations=1
              fi
            done

            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
            fi

            if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              messages="$(git log --format=%B "$base..$head")"
            else
              messages="$(git log --format=%B -n 1 "$head")"
            fi

            for term in "$first_term" "$second_term"; do
              if grep -qiF -- "$term" <<< "$messages"; then
                echo "Commit message contains prohibited keyword: $term"
                violations=1
              fi
            done

            exit "$violations"
          )"
          status="$?"
          {
            echo "output<<EOF"
            echo "$output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$output"
          exit "$status"

      - name: Close prohibited-content PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          POLICY_OUTPUT: ${{ steps.content_policy.outputs.output }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "This PR was closed automatically because it violates the repository content policy."
            echo
            echo "Prohibited vendor/model references are not accepted in code or commit messages."
            echo
            echo '```text'
            printf '%s\n' "$POLICY_OUTPUT"
            echo '```'
          } > content-policy-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file content-policy-comment.md
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

  commit-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Enforce single-commit PR policy
        shell: bash
        run: |
          set -euo pipefail

          head_ref="${{ github.head_ref }}"
          base_ref="${{ github.base_ref }}"

          if [[ "$head_ref" == "develop" && "$base_ref" == "main" ]]; then
            echo "Develop-to-main integration PR detected; multi-commit history is allowed."
            exit 0
          fi

          if [[ "$head_ref" =~ ^release/ ]] || [[ "$base_ref" =~ ^release/ ]]; then
            echo "Release/version branch PR detected; multi-commit history is allowed when needed."
            exit 0
          fi

          commit_count='${{ github.event.pull_request.commits }}'
          if [ "$commit_count" -ne 1 ]; then
            echo "Normal PRs from feature/fix/docs/chore branches must contain exactly one commit before review. Current PR has $commit_count commits. Squash the history before requesting review."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Checkout nnrp-conformance action
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nnrp-conformance
          path: nnrp-conformance-action
          fetch-depth: 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] build

      - name: Lint
        run: ruff check .

      - name: Test with coverage
        shell: pwsh
        run: |
          $pytestArgs = @(
            '--cov=src/nnrp'
            '--cov=scripts'
            '--cov-report=xml:artifacts/coverage/coverage.xml'
            '--cov-fail-under=90'
            '-q'
          )
          pytest @pytestArgs

      - name: Incremental line coverage gate
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        run: |
          base_sha=""
          head_sha=""

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          python scripts/check_incremental_coverage.py \
            --base-sha "$base_sha" \
            --head-sha "$head_sha" \
            --threshold 90 \
            --coverage-xml artifacts/coverage/coverage.xml

  conformance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout nnrp-conformance action
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nnrp-conformance
          path: nnrp-conformance-action
          fetch-depth: 1

      - name: Resolve conformance baseline
        id: conformance-baseline
        shell: pwsh
        run: |
          $capabilityFiles = Get-ChildItem (Join-Path $PWD 'conformance') -Filter '*.capabilities.json'
          if ($capabilityFiles.Count -ne 1) {
            throw "Expected exactly one capability manifest under conformance/, found $($capabilityFiles.Count)."
          }

          $capabilityFile = $capabilityFiles[0]
          $capabilityManifest = Get-Content -Raw $capabilityFile.FullName | ConvertFrom-Json
          $protocolVersion = [string]$capabilityManifest.protocol_version
          if ([string]::IsNullOrWhiteSpace($protocolVersion)) {
            throw "Capability manifest does not declare protocol_version: $($capabilityFile.FullName)"
          }

          "protocol-version=$protocolVersion" >> $env:GITHUB_OUTPUT
          "capabilities-path=conformance/$($capabilityFile.Name)" >> $env:GITHUB_OUTPUT
          "artifact-name=nnrp-py-conformance" >> $env:GITHUB_OUTPUT

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          ${{ steps.setup-python.outputs.python-path }} -m pip install --upgrade pip
          ${{ steps.setup-python.outputs.python-path }} -m pip install -e .[dev] build

      - name: Run suite-owned conformance action
        uses: ./nnrp-conformance-action/.github/actions/run-conformance
        with:
          protocol-version: ${{ steps.conformance-baseline.outputs.protocol-version }}
          capabilities-path: ${{ steps.conformance-baseline.outputs.capabilities-path }}
          working-directory: .
          artifact-name: ${{ steps.conformance-baseline.outputs.artifact-name }}
          adapter-command: >-
            ${{ steps.setup-python.outputs.python-path }} -m nnrp.tools.adapter_conformance
            --plan $env:NNRP_CONFORMANCE_ADAPTER_PLAN
            --output $env:NNRP_CONFORMANCE_ADAPTER_RESULTS

  wire-conformance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout nnrp-conformance runner
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nnrp-conformance
          path: nnrp-conformance-runner
          fetch-depth: 1

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nnrp-conformance-runner -> target

      - name: Install dependencies
        run: |
          ${{ steps.setup-python.outputs.python-path }} -m pip install --upgrade pip
          ${{ steps.setup-python.outputs.python-path }} -m pip install -e .[dev] build

      - name: Run wire conformance dry-run
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/wire-conformance

          transports=(
            --transport tcp=127.0.0.1:19091
            --transport quic=quic+tls://127.0.0.1:19092
            --transport ipc=unix:///tmp/nnrp.sock
            --transport websocket=wss://127.0.0.1:19093/nnrp
          )
          capabilities=(
            --capability control.cancel_abort
            --capability control.result_drop_reason
            --capability control.trace_context
            --capability control.priority_update
            --capability control.deadline_expire
            --capability control.progress_partial
            --capability control.credit_backpressure
            --capability object.lifecycle
            --capability control.capability_costs
            --capability control.route_execution_hint
            --capability cache.reference
            --capability control.degrade_profile
            --capability control.budget_update
          )

          for mode in suite_as_client suite_as_server suite_as_proxy; do
            target="artifacts/wire-conformance/target-${mode}.json"
            plan="artifacts/wire-conformance/plan-${mode}.json"
            results="artifacts/wire-conformance/results-${mode}.json"
            evidence_dir="artifacts/wire-conformance/evidence-${mode}"

            ${{ steps.setup-python.outputs.python-path }} -m nnrp.tools.wire_conformance \
              manifest \
              --target-name "nnrp-py-ci-${mode}" \
              --mode "$mode" \
              "${transports[@]}" \
              "${capabilities[@]}" \
              --output "$target"

            cargo run --manifest-path nnrp-conformance-runner/Cargo.toml -p nnrp-conformance-runner -- \
              wire-plan \
              --suite nnrp-conformance-runner/wire-conformance/nnrp-1-preview4/manifest.json \
              --target "$target" \
              --output "$plan" \
              --results-path "$results" \
              --evidence-dir "$evidence_dir"

            ${{ steps.setup-python.outputs.python-path }} -m nnrp.tools.wire_conformance \
              run-plan \
              --plan "$plan" \
              --mode "$mode" \
              --output "$results" \
              --evidence-dir "$evidence_dir"

            cargo run --manifest-path nnrp-conformance-runner/Cargo.toml -p nnrp-conformance-runner -- \
              validate-wire-results \
              --plan "$plan" \
              --results "$results"
          done

  required-checks:
    needs:
      - content-policy
      - commit-policy
      - test
      - conformance
      - wire-conformance
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Enforce required CI path
        shell: bash
        run: |
          if [ "${{ needs.content-policy.result }}" != "success" ]; then
            echo "Repository content policy validation failed."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.commit-policy.result }}" != "success" ]; then
            echo "PR commit policy validation failed."
            exit 1
          fi

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Lint, test, total coverage, or incremental coverage validation failed."
            exit 1
          fi

          if [ "${{ needs.conformance.result }}" != "success" ]; then
            echo "Conformance validation failed."
            exit 1
          fi

          if [ "${{ needs.wire-conformance.result }}" != "success" ]; then
            echo "Wire conformance validation failed."
            exit 1
          fi
