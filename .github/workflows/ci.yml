name: CI

env:
  NNRP_DOC_SOURCE_COMMIT: e568de05f0db1bfc914685dc5024722dc0f6f837
  NNRP_CONFORMANCE_SOURCE_COMMIT: 054bcbe6e58c42aec896a9618777a37727023797
  NNRP_RS_SOURCE_COMMIT: 35b4ed1e0764623d278035ca1449daeab4192c5c
  NNRP_RS_NATIVE_VERSION: 1.0.0-preview.4.25
  NNRP_RS_RELEASE_RUN_ID: "32365855992"

on:
  push:
    branches:
      - develop
      - main
      - release/**
  pull_request:
  workflow_dispatch:

jobs:
  content-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject prohibited vendor/model references
        id: content_policy
        shell: bash
        run: |
          set +e
          first_term="Anthro""pic"
          second_term="Clau""de"
          output="$(
            set -euo pipefail
            violations=0
            for term in "$first_term" "$second_term"; do
              matches="$(git grep -n -I -i -F -- "$term" -- . || true)"
              if [ -n "$matches" ]; then
                echo "Tracked file content contains prohibited keyword: $term"
                echo "$matches"
                violations=1
              fi
            done

            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
            fi

            if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              messages="$(git log --format=%B "$base..$head")"
            else
              messages="$(git log --format=%B -n 1 "$head")"
            fi

            for term in "$first_term" "$second_term"; do
              if grep -qiF -- "$term" <<< "$messages"; then
                echo "Commit message contains prohibited keyword: $term"
                violations=1
              fi
            done

            exit "$violations"
          )"
          status="$?"
          {
            echo "output<<EOF"
            echo "$output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$output"
          exit "$status"

      - name: Close prohibited-content PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          POLICY_OUTPUT: ${{ steps.content_policy.outputs.output }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "This PR was closed automatically because it violates the repository content policy."
            echo
            echo "Prohibited vendor/model references are not accepted in code or commit messages."
            echo
            echo '```text'
            printf '%s\n' "$POLICY_OUTPUT"
            echo '```'
          } > content-policy-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file content-policy-comment.md
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

  commit-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Enforce single-commit PR policy
        shell: bash
        run: |
          set -euo pipefail

          head_ref="${{ github.head_ref }}"
          base_ref="${{ github.base_ref }}"

          if [[ "$head_ref" == "develop" && "$base_ref" == "main" ]]; then
            echo "Develop-to-main integration PR detected; multi-commit history is allowed."
            exit 0
          fi

          if [[ "$head_ref" =~ ^release/ ]] || [[ "$base_ref" =~ ^release/ ]]; then
            echo "Release/version branch PR detected; multi-commit history is allowed when needed."
            exit 0
          fi

          commit_count='${{ github.event.pull_request.commits }}'
          if [ "$commit_count" -ne 1 ]; then
            echo "Normal PRs from feature/fix/docs/chore branches must contain exactly one commit before review. Current PR has $commit_count commits. Squash the history before requesting review."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout frozen SDK API contract
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nnrp-doc
          path: nnrp-doc-contract
          ref: ${{ env.NNRP_DOC_SOURCE_COMMIT }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Checkout nnrp-conformance action
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nnrp-conformance
          path: nnrp-conformance-action
          ref: ${{ env.NNRP_CONFORMANCE_SOURCE_COMMIT }}
          fetch-depth: 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] build

      - name: Lint
        run: ruff check src tests scripts

      - name: SDK API contract parity
        run: >-
          python scripts/check_sdk_api_contract.py
          --contract nnrp-doc-contract/docs/public/contracts/nnrp-1-preview4-sdk-api.json

      - name: Download commit-pinned Rust native transport artifacts for tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/download_nnrp_rs_workflow_artifacts.py
          --repo ${{ github.repository_owner }}/nnrp-rs
          --version ${{ env.NNRP_RS_NATIVE_VERSION }}
          --workflow-run-id ${{ env.NNRP_RS_RELEASE_RUN_ID }}
          --workflow-commit ${{ env.NNRP_RS_SOURCE_COMMIT }}
          --output artifacts/native-downloads

      - name: Prepare Rust native transport artifacts for tests
        run: >-
          python scripts/prepare_native_artifacts.py
          --clean artifacts/native-downloads/*.zip

      - name: Test with coverage
        shell: pwsh
        run: |
          $pytestArgs = @(
            '--cov=src/nnrp'
            '--cov=scripts'
            '--cov-report=xml:artifacts/coverage/coverage.xml'
            '--cov-fail-under=90'
            '-q'
          )
          pytest @pytestArgs

      - name: Incremental line coverage gate
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        run: |
          base_sha=""
          head_sha=""

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          python scripts/check_incremental_coverage.py \
            --base-sha "$base_sha" \
            --head-sha "$head_sha" \
            --threshold 90 \
            --coverage-xml artifacts/coverage/coverage.xml

  conformance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout nnrp-conformance action
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nnrp-conformance
          path: nnrp-conformance-action
          ref: ${{ env.NNRP_CONFORMANCE_SOURCE_COMMIT }}
          fetch-depth: 1

      - name: Resolve conformance baseline
        id: conformance-baseline
        shell: pwsh
        run: |
          $capabilityFiles = Get-ChildItem (Join-Path $PWD 'conformance') -Filter '*.capabilities.json'
          if ($capabilityFiles.Count -ne 1) {
            throw "Expected exactly one capability manifest under conformance/, found $($capabilityFiles.Count)."
          }

          $capabilityFile = $capabilityFiles[0]
          $capabilityManifest = Get-Content -Raw $capabilityFile.FullName | ConvertFrom-Json
          $protocolVersion = [string]$capabilityManifest.protocol_version
          if ([string]::IsNullOrWhiteSpace($protocolVersion)) {
            throw "Capability manifest does not declare protocol_version: $($capabilityFile.FullName)"
          }

          "protocol-version=$protocolVersion" >> $env:GITHUB_OUTPUT
          "capabilities-path=conformance/$($capabilityFile.Name)" >> $env:GITHUB_OUTPUT
          "artifact-name=nnrp-py-conformance" >> $env:GITHUB_OUTPUT

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          ${{ steps.setup-python.outputs.python-path }} -m pip install --upgrade pip
          ${{ steps.setup-python.outputs.python-path }} -m pip install -e .[dev] build

      - name: Download commit-pinned Rust native transport artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ${{ steps.setup-python.outputs.python-path }} scripts/download_nnrp_rs_workflow_artifacts.py
          --repo ${{ github.repository_owner }}/nnrp-rs
          --version ${{ env.NNRP_RS_NATIVE_VERSION }}
          --workflow-run-id ${{ env.NNRP_RS_RELEASE_RUN_ID }}
          --workflow-commit ${{ env.NNRP_RS_SOURCE_COMMIT }}
          --output artifacts/native-downloads

      - name: Prepare Rust native transport artifacts for adapter cases
        run: >-
          ${{ steps.setup-python.outputs.python-path }} scripts/prepare_native_artifacts.py
          --clean artifacts/native-downloads/*.zip

      - name: Run suite-owned conformance action
        uses: ./nnrp-conformance-action/.github/actions/run-conformance
        with:
          protocol-version: ${{ steps.conformance-baseline.outputs.protocol-version }}
          capabilities-path: ${{ steps.conformance-baseline.outputs.capabilities-path }}
          require-complete-capability-coverage: "true"
          working-directory: .
          artifact-name: ${{ steps.conformance-baseline.outputs.artifact-name }}
          adapter-command: >-
            ${{ steps.setup-python.outputs.python-path }} -m nnrp.tools.adapter_conformance
            --plan $env:NNRP_CONFORMANCE_ADAPTER_PLAN
            --output $env:NNRP_CONFORMANCE_ADAPTER_RESULTS

  wire-conformance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout nnrp-conformance runner
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nnrp-conformance
          path: nnrp-conformance-runner
          ref: ${{ env.NNRP_CONFORMANCE_SOURCE_COMMIT }}
          fetch-depth: 1

      - name: Checkout pinned nnrp-rs source
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nnrp-rs
          path: nnrp-rs-source
          ref: ${{ env.NNRP_RS_SOURCE_COMMIT }}
          fetch-depth: 1

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nnrp-conformance-runner -> target
            nnrp-rs-source -> target

      - name: Install dependencies
        run: |
          ${{ steps.setup-python.outputs.python-path }} -m pip install --upgrade pip
          ${{ steps.setup-python.outputs.python-path }} -m pip install -e .[dev] build

      - name: Build pinned Rust native transport artifacts
        shell: bash
        working-directory: nnrp-rs-source
        run: >-
          python scripts/package_native_artifacts.py
          --out artifacts/native
          --transport-scope tcp
          --transport-scope quic
          --transport-scope ipc
          --transport-scope websocket

      - name: Prepare Rust native transport artifacts
        shell: bash
        run: python scripts/prepare_native_artifacts.py --clean nnrp-rs-source/artifacts/native

      - name: Run packaged native role E2E
        env:
          NNRP_NATIVE_E2E: '1'
        run: ${{ steps.setup-python.outputs.python-path }} -m pytest tests/test_native_artifact_e2e.py -q

      - name: Run independent-process Preview4 wire E2E
        shell: pwsh
        run: >-
          ./scripts/run_wire_e2e.ps1
          -ConformanceRoot nnrp-conformance-runner
          -ArtifactDirectory artifacts/wire-conformance
          -PythonExecutable '${{ steps.setup-python.outputs.python-path }}'

  required-checks:
    needs:
      - content-policy
      - commit-policy
      - test
      - conformance
      - wire-conformance
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Enforce required CI path
        shell: bash
        run: |
          if [ "${{ needs.content-policy.result }}" != "success" ]; then
            echo "Repository content policy validation failed."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.commit-policy.result }}" != "success" ]; then
            echo "PR commit policy validation failed."
            exit 1
          fi

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Lint, test, total coverage, or incremental coverage validation failed."
            exit 1
          fi

          if [ "${{ needs.conformance.result }}" != "success" ]; then
            echo "Conformance validation failed."
            exit 1
          fi

          if [ "${{ needs.wire-conformance.result }}" != "success" ]; then
            echo "Wire conformance validation failed."
            exit 1
          fi
