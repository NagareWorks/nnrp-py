name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to release when running manually
        required: true
        default: main
      rust_native_version:
        description: nnrp-rs native artifact version to embed in wheels
        required: true
        default: 1.0.0-preview.4.23
      create_tag:
        description: Create and push the resolved release tag before publishing
        required: true
        type: boolean
        default: false
      publish_github_release:
        description: Publish or update the GitHub Release
        required: true
        type: boolean
        default: false
      publish_to_pypi:
        description: Publish built distributions to PyPI
        required: true
        type: boolean
        default: false
      python_version:
        description: Python version used for release tooling and validation
        required: false
        default: '3.11'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
    env:
      PYPI_PUBLISH_MODE: ${{ vars.PYPI_PUBLISH_MODE || 'disabled' }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      NNRP_RS_NATIVE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.rust_native_version || vars.NNRP_RS_NATIVE_VERSION || '1.0.0-preview.4.23' }}
      NNRP_RS_RELEASE_RUN_ID: "32009630987"
      NNRP_RS_SOURCE_COMMIT: 00074cf3c09002de940f011e229de729aa377e88
      NNRP_CONFORMANCE_SOURCE_COMMIT: 685505dc0624f68ff4d660c78d24ea7e9b1b0290
      NNRP_DOC_SOURCE_COMMIT: 3439ded0d318bd736f6485b17f2563fae77627bf
      NNRP_PY_RELEASE_PYTHON_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || vars.NNRP_PY_RELEASE_PYTHON_VERSION || '3.11' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.NNRP_PY_RELEASE_PYTHON_VERSION }}

      - name: Resolve version
        id: version
        run: |
          python scripts/resolve_version.py show --github-output --run-number ""

      - name: Validate pushed tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          expected_tag="${{ steps.version.outputs.tag_name }}"
          actual_tag="${{ github.ref_name }}"

          if [ "$actual_tag" != "$expected_tag" ]; then
            echo "Release tag mismatch: expected $expected_tag but workflow was triggered by $actual_tag."
            exit 1
          fi

      - name: Validate manual release options
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.publish_github_release }}" = "true" ] && [ "${{ inputs.create_tag }}" != "true" ]; then
            echo "Manual GitHub Release publishing requires create_tag=true so the release is anchored to an explicit tag."
            exit 1
          fi

          if [ "${{ inputs.publish_to_pypi }}" = "true" ] && [ "${{ inputs.create_tag }}" != "true" ]; then
            echo "Manual PyPI publishing requires create_tag=true so package publication cannot start from an untagged ref."
            exit 1
          fi

      - name: Validate immutable release identity
        env:
          CHECK_PYPI: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi)) && (env.PYPI_PUBLISH_MODE == 'trusted' || (env.PYPI_PUBLISH_MODE == 'token' && env.PYPI_API_TOKEN != '')) }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags
          arguments=(
            --expected-ref origin/main
            --tag "${{ steps.version.outputs.tag_name }}"
            --package nnrp-py
            --version "${{ steps.version.outputs.package_version }}"
          )
          if [ "$CHECK_PYPI" = "true" ]; then
            arguments+=(--check-pypi)
          fi
          python scripts/check_release_identity.py "${arguments[@]}"

      - name: Capture release source commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Apply build version
        run: |
          python scripts/resolve_version.py apply --package-version "${{ steps.version.outputs.package_version }}"

      - name: Download Rust native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          python scripts/download_nnrp_rs_workflow_artifacts.py \
            --repo "${{ github.repository_owner }}/nnrp-rs" \
            --version "$NNRP_RS_NATIVE_VERSION" \
            --workflow-run-id "$NNRP_RS_RELEASE_RUN_ID" \
            --workflow-commit "$NNRP_RS_SOURCE_COMMIT" \
            --output artifacts/native-downloads

      - name: Prepare package native artifacts
        shell: bash
        run: |
          set -euo pipefail

          python scripts/prepare_native_artifacts.py --clean artifacts/native-downloads/*.zip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] build twine

      - name: Test
        run: pytest -q

      - name: Smoke native IPC and WebSocket artifacts
        run: >
          python scripts/smoke_native_transport_artifacts.py
          --root src/nnrp/native_artifacts
          --transport ipc
          --transport websocket

      - name: Build source distribution without native payloads
        shell: bash
        run: |
          set -euo pipefail

          rm -rf src/nnrp/native_artifacts
          python -m build --sdist --outdir dist
          python scripts/verify_sdist.py --dist dist --max-bytes 5000000
          python scripts/prepare_native_artifacts.py --clean artifacts/native-downloads/*.zip

      - name: Build staged wheel with native payloads
        run: python -m build --wheel --outdir artifacts/staged-wheel

      - name: Build platform wheels
        shell: bash
        run: |
          set -euo pipefail

          python scripts/build_native_wheels.py \
            --wheel artifacts/staged-wheel/*.whl \
            --dist dist

      - name: Run installed wheel native role E2E
        shell: bash
        run: |
          set -euo pipefail

          candidate_wheel="$(find dist -maxdepth 1 -type f -name '*-manylinux_2_28_x86_64.whl' -print -quit)"
          if [ -z "$candidate_wheel" ]; then
            echo "The release did not build a Linux x86_64 candidate wheel for installed-package validation."
            exit 1
          fi

          python -m venv artifacts/installed-wheel-e2e-venv
          artifacts/installed-wheel-e2e-venv/bin/python -m pip install --upgrade pip
          artifacts/installed-wheel-e2e-venv/bin/python -m pip install \
            "$candidate_wheel" \
            pytest \
            pytest-asyncio \
            cryptography
          mkdir -p artifacts/installed-wheel-e2e-case
          cp tests/test_native_artifact_e2e.py artifacts/installed-wheel-e2e-case/test_native_artifact_e2e.py
          (
            cd artifacts/installed-wheel-e2e-case
            NNRP_NATIVE_E2E=1 ../installed-wheel-e2e-venv/bin/python -m pytest test_native_artifact_e2e.py -q
          )

      - name: Verify packaged native artifacts
        run: >
          python scripts/verify_native_wheel.py
          --dist dist
          --require-native
          --reject-universal-native
          --require-single-platform
          --verify-platform-tag
          --require-split-transports
          --require-preview4-native-artifacts
          --require-abi-version 4.4.0

      - name: Run native runtime benchmark smoke thresholds
        shell: bash
        run: |
          set -euo pipefail

          candidate_wheel="$(find dist -maxdepth 1 -type f -name '*-manylinux_2_28_x86_64.whl' -print -quit)"
          if [ -z "$candidate_wheel" ]; then
            echo "The release did not build a Linux x86_64 candidate wheel for benchmark validation."
            exit 1
          fi

          python -m pip install --force-reinstall --no-deps "$candidate_wheel"
          export NNRP_BENCHMARK_CANDIDATE_WHEEL="$(basename "$candidate_wheel")"
          export NNRP_BENCHMARK_RUST_ARTIFACT_VERSION="$NNRP_RS_NATIVE_VERSION"
          export NNRP_BENCHMARK_SDK_COMMIT="$GITHUB_SHA"

          mkdir -p artifacts/benchmark
          python -m nnrp.tools.benchmark \
            --plan doc/benchmarks/native-runtime-benchmark-plan.json \
            --output artifacts/benchmark/native-runtime-benchmark-results.json
          python scripts/check_benchmark_thresholds.py \
            --results artifacts/benchmark/native-runtime-benchmark-results.json \
            --thresholds doc/benchmarks/native-runtime-smoke-thresholds.json

      - name: Build release manifest
        run: >-
          python scripts/release_manifest.py build
          --dist dist
          --output artifacts/release/release-manifest.json
          --package nnrp-py
          --version "${{ steps.version.outputs.package_version }}"
          --tag "${{ steps.version.outputs.tag_name }}"
          --repository "${{ github.repository }}"
          --source-commit "${{ steps.source.outputs.commit }}"
          --rust-version "$NNRP_RS_NATIVE_VERSION"
          --rust-source-commit "$NNRP_RS_SOURCE_COMMIT"
          --rust-release-run-id "$NNRP_RS_RELEASE_RUN_ID"
          --conformance-commit "$NNRP_CONFORMANCE_SOURCE_COMMIT"
          --documentation-commit "$NNRP_DOC_SOURCE_COMMIT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nnrp-py-wheels-${{ steps.version.outputs.package_version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            artifacts/release/release-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Create git tag
        if: github.event_name == 'workflow_dispatch' && inputs.create_tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags
          tag="${{ steps.version.outputs.tag_name }}"
          if [ -z "$(git tag --list "$tag")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: Publish to PyPI with Trusted Publisher
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_to_pypi)) && env.PYPI_PUBLISH_MODE == 'trusted'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to PyPI with API token
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_to_pypi)) && env.PYPI_PUBLISH_MODE == 'token' && env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_API_TOKEN }}

      - name: Verify public PyPI release from a fresh environment
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_to_pypi)) && (env.PYPI_PUBLISH_MODE == 'trusted' || (env.PYPI_PUBLISH_MODE == 'token' && env.PYPI_API_TOKEN != ''))
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/public-pypi-download
          for attempt in $(seq 1 20); do
            rm -f artifacts/public-pypi-download/*
            if python -m pip download \
              --no-cache-dir \
              --no-deps \
              --only-binary=:all: \
              --index-url https://pypi.org/simple \
              --dest artifacts/public-pypi-download \
              "nnrp-py==${{ steps.version.outputs.package_version }}"; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Published package did not become available from public PyPI."
              exit 1
            fi
            sleep 15
          done

          public_wheel="$(find artifacts/public-pypi-download -maxdepth 1 -type f -name '*.whl' -print -quit)"
          if [ -z "$public_wheel" ]; then
            echo "Public PyPI download did not produce a wheel."
            exit 1
          fi
          python scripts/release_manifest.py verify \
            --manifest artifacts/release/release-manifest.json \
            --distribution "$public_wheel"

          python -m venv artifacts/public-pypi-venv
          artifacts/public-pypi-venv/bin/python -m pip install --upgrade pip
          artifacts/public-pypi-venv/bin/python -m pip install \
            "$public_wheel" \
            pytest \
            pytest-asyncio \
            cryptography
          mkdir -p artifacts/public-pypi-e2e-case
          cp tests/test_native_artifact_e2e.py artifacts/public-pypi-e2e-case/test_native_artifact_e2e.py
          (
            cd artifacts/public-pypi-e2e-case
            NNRP_NATIVE_E2E=1 ../public-pypi-venv/bin/python -m pytest test_native_artifact_e2e.py -q
          )

      - name: Publish GitHub release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_github_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.release_name }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            artifacts/release/release-manifest.json
