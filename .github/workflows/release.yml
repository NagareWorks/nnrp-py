name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify change set
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          head="${{ github.sha }}"

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "$base" "$head")

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          for path in "${changed_files[@]}"; do
            if [[ "$path" == *.md ]] || [[ "$path" =~ ^(doc/|docs/|\.github/PULL_REQUEST_TEMPLATE/) ]] || [[ "$path" =~ ^\.github/[^/]+\.md$ ]]; then
              continue
            fi

            docs_only=false
            break
          done

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  package:
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve version
        id: version
        run: |
          python scripts/resolve_version.py show --github-output

      - name: Apply build version
        run: |
          python scripts/resolve_version.py apply --package-version "${{ steps.version.outputs.package_version }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] build twine

      - name: Test
        run: pytest -q

      - name: Build distribution
        run: python -m build

      - name: Bundle release artifacts
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          version = '${{ steps.version.outputs.package_version }}'
          artifact_dir = pathlib.Path('artifacts')
          artifact_dir.mkdir(exist_ok=True)
          artifact = artifact_dir / f'nnrp-py-{version}.zip'
          with zipfile.ZipFile(artifact, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for item in sorted(pathlib.Path('dist').glob('*')):
                  archive.write(item, item.name)
          PY

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nnrp-py-release-${{ steps.version.outputs.package_version }}
          path: artifacts/nnrp-py-${{ steps.version.outputs.package_version }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create git tag
        if: github.ref_name == github.event.repository.default_branch
        run: |
          git fetch --tags
          tag="${{ steps.version.outputs.tag_name }}"
          if [ -z "$(git tag --list "$tag")" ]; then
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: Publish GitHub release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.release_name }}
          files: artifacts/nnrp-py-${{ steps.version.outputs.package_version }}.zip

      - name: Publish to PyPI
        if: github.ref_name == github.event.repository.default_branch && env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --skip-existing dist/*