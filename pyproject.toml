[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nnrp-py"
version = "1.0.0rc4.post15"
description = "Python SDK for NNRP protocol primitives and adapters"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "NagareWorks" }
]
keywords = ["nnrp", "protocol", "sdk", "streaming", "inference"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "aioquic>=1.2.0",
  "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/NagareWorks/nnrp-py"
Repository = "https://github.com/NagareWorks/nnrp-py"
Issues = "https://github.com/NagareWorks/nnrp-py/issues"

[project.scripts]
nnrp-run-benchmark = "nnrp.tools.benchmark:main"
nnrp-quic-smoke = "nnrp.tools.smoke:main"
nnrp-wire-conformance = "nnrp.tools.wire_conformance:main"
nnrp-wire-target-manifest = "nnrp.tools.wire_conformance:main"
nnrp-wire-host-route-target = "nnrp.tools.host_route_target:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.6.0",
  "setuptools>=82.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nnrp"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.venv*",
  "/artifacts",
  "/dist",
  "/src/nnrp/native_artifacts",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
strict = false
packages = ["nnrp"]

[dependency-groups]
dev = [
    "setuptools>=82.0.1",
]
