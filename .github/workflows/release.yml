name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to release when running manually
        required: true
        default: develop
      rust_native_version:
        description: nnrp-rs native artifact version to embed in wheels
        required: true
        default: 1.0.0-preview.4.0
      create_tag:
        description: Create and push the resolved release tag before publishing
        required: true
        type: boolean
        default: false
      publish_github_release:
        description: Publish or update the GitHub Release
        required: true
        type: boolean
        default: false
      publish_to_pypi:
        description: Publish built distributions to PyPI
        required: true
        type: boolean
        default: false
      python_version:
        description: Python version used to build abi3 cffi API wheel extensions
        required: false
        default: '3.11'

permissions:
  contents: write

jobs:
  build-cffi-api:
    name: Build cffi API (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      NNRP_PY_RELEASE_PYTHON_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || vars.NNRP_PY_RELEASE_PYTHON_VERSION || '3.11' }}
      CIBW_ARCHS: ${{ matrix.cibw_archs }}
      CIBW_PLATFORM: ${{ matrix.cibw_platform }}
      CIBW_BUILD_FRONTEND: build
      CIBW_BUILD_OVERRIDE: ${{ matrix.cibw_build }}
      CIBW_SKIP: "pp* *musllinux*"
      CIBW_TEST_SKIP: "*"
      CIBW_MANYLINUX_I686_IMAGE: quay.io/pypa/manylinux_2_28_i686
      CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
      CIBW_MANYLINUX_AARCH64_IMAGE: quay.io/pypa/manylinux_2_28_aarch64
      CIBW_MANYLINUX_ARMV7L_IMAGE: quay.io/pypa/manylinux_2_31_armv7l
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86
            os: ubuntu-latest
            cibw_platform: linux
            cibw_archs: x86_64 i686
            optional: false
          - name: linux-arm
            os: ubuntu-latest
            cibw_platform: linux
            cibw_archs: aarch64 armv7l
            optional: false
          - name: windows
            os: windows-latest
            cibw_platform: windows
            cibw_archs: AMD64 x86 ARM64
            optional: false
          - name: macos
            os: macos-14
            cibw_platform: macos
            cibw_archs: x86_64 arm64
            optional: false
          - name: android
            os: ubuntu-latest
            cibw_platform: android
            cibw_build: cp313-*
            cibw_archs: x86_64 arm64_v8a
            optional: true
          - name: ios
            os: macos-14
            cibw_platform: ios
            cibw_build: cp313-*
            cibw_archs: arm64_iphoneos arm64_iphonesimulator x86_64_iphonesimulator
            optional: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.NNRP_PY_RELEASE_PYTHON_VERSION }}

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" cibuildwheel

      - name: Resolve version
        id: version
        shell: bash
        run: python scripts/resolve_version.py show --github-output --run-number ""

      - name: Write cffi API build project
        shell: bash
        run: |
          set -euo pipefail
          abi3_tag="cp${NNRP_PY_RELEASE_PYTHON_VERSION//./}"
          python scripts/write_cffi_api_build_project.py \
            --output artifacts/cffi-api-build \
            --package-version "${{ steps.version.outputs.package_version }}" \
            --abi3-python-tag "$abi3_tag"

      - name: Setup Linux ARM emulation
        if: matrix.name == 'linux-arm'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Build cffi API wheels
        id: build_cffi
        continue-on-error: ${{ matrix.optional }}
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CIBW_BUILD_OVERRIDE}" ]; then
            export CIBW_BUILD="${CIBW_BUILD_OVERRIDE}"
          else
            export CIBW_BUILD="cp${NNRP_PY_RELEASE_PYTHON_VERSION//./}-*"
          fi
          python -m cibuildwheel artifacts/cffi-api-build --output-dir artifacts/cffi-api-wheels

      - name: Extract cffi API extensions
        if: steps.build_cffi.outcome == 'success'
        id: extract_cffi
        shell: bash
        run: >
          python scripts/extract_cffi_api_wheels.py
          --wheel-dir artifacts/cffi-api-wheels
          --output artifacts/cffi-api
          --clean

      - name: Upload cffi API extensions
        if: steps.extract_cffi.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: nnrp-py-cffi-api-${{ matrix.name }}
          path: artifacts/cffi-api/**
          if-no-files-found: error
          retention-days: 14

  package:
    needs: build-cffi-api
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
    env:
      PYPI_PUBLISH_MODE: ${{ vars.PYPI_PUBLISH_MODE || 'disabled' }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      NNRP_RS_NATIVE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.rust_native_version || vars.NNRP_RS_NATIVE_VERSION || '1.0.0-preview.4.0' }}
      NNRP_PY_RELEASE_PYTHON_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || vars.NNRP_PY_RELEASE_PYTHON_VERSION || '3.11' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.NNRP_PY_RELEASE_PYTHON_VERSION }}

      - name: Resolve version
        id: version
        run: |
          python scripts/resolve_version.py show --github-output --run-number ""

      - name: Validate pushed tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          expected_tag="${{ steps.version.outputs.tag_name }}"
          actual_tag="${{ github.ref_name }}"

          if [ "$actual_tag" != "$expected_tag" ]; then
            echo "Release tag mismatch: expected $expected_tag but workflow was triggered by $actual_tag."
            exit 1
          fi

      - name: Validate manual release options
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.publish_github_release }}" = "true" ] && [ "${{ inputs.create_tag }}" != "true" ]; then
            echo "Manual GitHub Release publishing requires create_tag=true so the release is anchored to an explicit tag."
            exit 1
          fi

          if [ "${{ inputs.publish_to_pypi }}" = "true" ] && [ "${{ inputs.create_tag }}" != "true" ]; then
            echo "Manual PyPI publishing requires create_tag=true so package publication cannot start from an untagged ref."
            exit 1
          fi

      - name: Create git tag
        if: github.event_name == 'workflow_dispatch' && inputs.create_tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags
          tag="${{ steps.version.outputs.tag_name }}"
          if [ -z "$(git tag --list "$tag")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: Apply build version
        run: |
          python scripts/resolve_version.py apply --package-version "${{ steps.version.outputs.package_version }}"

      - name: Download Rust native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${NNRP_RS_NATIVE_VERSION}"
          tag="v${version}"
          mkdir -p artifacts/native-downloads
          gh release download "$tag" \
            --repo "${{ github.repository_owner }}/nnrp-rs" \
            --pattern "nnrp-ffi-transport-tcp-native-*-${version}.zip" \
            --pattern "nnrp-ffi-transport-quic-native-*-${version}.zip" \
            --pattern "nnrp-ffi-transport-ipc-native-*-${version}.zip" \
            --pattern "nnrp-ffi-transport-websocket-native-*-${version}.zip" \
            --dir artifacts/native-downloads

      - name: Prepare package native artifacts
        shell: bash
        run: |
          set -euo pipefail

          python scripts/prepare_native_artifacts.py --clean artifacts/native-downloads/*.zip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] build twine

      - name: Test
        run: pytest -q

      - name: Download cffi API fast-path modules
        uses: actions/download-artifact@v7
        with:
          pattern: nnrp-py-cffi-api-*
          path: artifacts/cffi-api
          merge-multiple: true

      - name: Build source distribution without native payloads
        shell: bash
        run: |
          set -euo pipefail

          rm -rf src/nnrp/native_artifacts
          python -m build --sdist --outdir dist
          python scripts/prepare_native_artifacts.py --clean artifacts/native-downloads/*.zip

      - name: Build staged wheel with native payloads
        run: python -m build --wheel --outdir artifacts/staged-wheel

      - name: Build platform wheels
        shell: bash
        run: |
          set -euo pipefail

          python scripts/build_native_wheels.py \
            --wheel artifacts/staged-wheel/*.whl \
            --dist dist \
            --cffi-dir artifacts/cffi-api \
            --require-cffi-api \
            --publish-cffi-api-artifacts-only \
            --abi3-python-tag "$NNRP_PY_RELEASE_PYTHON_VERSION"

      - name: Verify packaged native artifacts
        run: python scripts/verify_native_wheel.py --dist dist --require-native --reject-universal-native --require-single-platform --verify-platform-tag --require-cffi-api --require-compiled-cffi-api --require-split-transports

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nnrp-py-wheels-${{ steps.version.outputs.package_version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_github_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.release_name }}
          files: dist/*.whl

      - name: Publish to PyPI with Trusted Publisher
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_to_pypi)) && env.PYPI_PUBLISH_MODE == 'trusted'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to PyPI with API token
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_to_pypi)) && env.PYPI_PUBLISH_MODE == 'token' && env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_API_TOKEN }}
