name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to release when running manually
        required: true
        default: develop
      rust_native_version:
        description: nnrp-rs native artifact version to embed in wheels
        required: true
        default: 1.0.0-preview.3.6
      create_tag:
        description: Create and push the resolved release tag before publishing
        required: true
        type: boolean
        default: false
      publish_github_release:
        description: Publish or update the GitHub Release
        required: true
        type: boolean
        default: false
      publish_to_pypi:
        description: Publish built distributions to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
    env:
      PYPI_PUBLISH_MODE: ${{ vars.PYPI_PUBLISH_MODE || 'disabled' }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      NNRP_RS_NATIVE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.rust_native_version || vars.NNRP_RS_NATIVE_VERSION || '1.0.0-preview.3.6' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve version
        id: version
        run: |
          python scripts/resolve_version.py show --github-output --run-number ""

      - name: Validate pushed tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          expected_tag="${{ steps.version.outputs.tag_name }}"
          actual_tag="${{ github.ref_name }}"

          if [ "$actual_tag" != "$expected_tag" ]; then
            echo "Release tag mismatch: expected $expected_tag but workflow was triggered by $actual_tag."
            exit 1
          fi

      - name: Validate manual release options
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.publish_github_release }}" = "true" ] && [ "${{ inputs.create_tag }}" != "true" ]; then
            echo "Manual GitHub Release publishing requires create_tag=true so the release is anchored to an explicit tag."
            exit 1
          fi

          if [ "${{ inputs.publish_to_pypi }}" = "true" ] && [ "${{ inputs.create_tag }}" != "true" ]; then
            echo "Manual PyPI publishing requires create_tag=true so package publication cannot start from an untagged ref."
            exit 1
          fi

      - name: Create git tag
        if: github.event_name == 'workflow_dispatch' && inputs.create_tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags
          tag="${{ steps.version.outputs.tag_name }}"
          if [ -z "$(git tag --list "$tag")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: Apply build version
        run: |
          python scripts/resolve_version.py apply --package-version "${{ steps.version.outputs.package_version }}"

      - name: Download Rust native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${NNRP_RS_NATIVE_VERSION}"
          tag="v${version}"
          mkdir -p artifacts/native-downloads
          gh release download "$tag" \
            --repo "${{ github.repository_owner }}/nnrp-rs" \
            --pattern "nnrp-ffi-native-*-${version}.zip" \
            --dir artifacts/native-downloads

      - name: Prepare package native artifacts
        shell: bash
        run: |
          set -euo pipefail

          python scripts/prepare_native_artifacts.py --clean artifacts/native-downloads/*.zip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] build twine

      - name: Test
        run: pytest -q

      - name: Build cffi API fast-path module
        run: python scripts/build_cffi_api.py --clean --output artifacts/cffi-api

      - name: Build source distribution without native payloads
        shell: bash
        run: |
          set -euo pipefail

          rm -rf src/nnrp/native_artifacts
          python -m build --sdist --outdir dist
          python scripts/prepare_native_artifacts.py --clean artifacts/native-downloads/*.zip

      - name: Build staged wheel with native payloads
        run: python -m build --wheel --outdir artifacts/staged-wheel

      - name: Build platform wheels
        shell: bash
        run: |
          set -euo pipefail

          python scripts/build_native_wheels.py --wheel artifacts/staged-wheel/*.whl --dist dist --cffi-dir artifacts/cffi-api

      - name: Verify packaged native artifacts
        run: python scripts/verify_native_wheel.py --dist dist --require-native --reject-universal-native --require-single-platform --verify-platform-tag

      - name: Bundle release artifacts
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          version = '${{ steps.version.outputs.package_version }}'
          artifact_dir = pathlib.Path('artifacts')
          artifact_dir.mkdir(exist_ok=True)
          artifact = artifact_dir / f'nnrp-py-{version}.zip'
          with zipfile.ZipFile(artifact, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for item in sorted(pathlib.Path('dist').glob('*')):
                  archive.write(item, item.name)
          PY

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nnrp-py-release-${{ steps.version.outputs.package_version }}
          path: artifacts/nnrp-py-${{ steps.version.outputs.package_version }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_github_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.release_name }}
          files: artifacts/nnrp-py-${{ steps.version.outputs.package_version }}.zip

      - name: Publish to PyPI with Trusted Publisher
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_to_pypi)) && env.PYPI_PUBLISH_MODE == 'trusted'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to PyPI with API token
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_to_pypi)) && env.PYPI_PUBLISH_MODE == 'token' && env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_API_TOKEN }}
